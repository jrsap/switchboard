<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Switchboard{% endblock %}</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f6f7f9; color: #1a1a1a; }
    nav { background: #1f2937; padding: 12px 24px; display: flex; gap: 16px; align-items: center; }
    nav a { color: #d1d5db; text-decoration: none; }
    nav a:hover { color: #fff; }
    nav .brand { font-weight: 700; color: #fff; }
    main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
    th { background: #f3f4f6; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    pre { background: #111827; color: #e5e7eb; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
    input[type=text], input[type=password], input[type=number] { padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; width: 260px; }
    button, .btn { background: #2563eb; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }
    .error { color: #b91c1c; }
    .muted { color: #6b7280; font-size: 12px; }
    .ok { color: #047857; }
    .status-2 { color: #047857; }
    .status-4, .status-5 { color: #b91c1c; }
    label { display: block; margin: 10px 0 4px; font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">Switchboard</span>
    {% if user %}
      <a href="/activity">Activity</a>
      <a href="/status">Status</a>
      <a href="/orgs">Organizations</a>
      <a href="/logout">Logout ({{ user.username }})</a>
    {% endif %}
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
